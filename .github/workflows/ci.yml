name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        with:
          name: village-control-plane
          path: apps/control-plane/dist
      - uses: actions/upload-artifact@v4
        with:
          name: village-desktop
          path: apps/desktop/dist
      - uses: actions/upload-artifact@v4
        with:
          name: village-web
          path: apps/web/dist
  packaged-delegated-workflow:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @village/desktop package:mac:e2e
      - run: pnpm verify:delegated-workflow
      - run: pnpm verify:delegated-workflow:recovery
      - run: pnpm verify:delegated-workflow:abrupt-recovery
